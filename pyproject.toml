[tool.poetry]
name = "stock-chatbot"
version = "0.1.2"
description = "AI stock market assistant: risk clustering, price movement classification and an LLM-to-SQL chatbot."
authors = ["Project team"]
readme = "README.md"
packages = [{include = "stock_chatbot", from = "src"}]

[tool.poetry.dependencies]
python = "==3.9.23"
pandas = "2.2.3"
matplotlib = "3.7"
scikit-learn = ">=1.6.1,<2.0.0"
numpy = "<2.0"
gradio = ">=4.0.0,<5.0.0"
seaborn = ">=0.12.0,<1.0.0"
xgboost = ">=1.7.0,<3.0.0"
plotly = ">=5.0.0,<6.0.0"
jupyter = ">=1.0.0,<2.0.0"
nbformat = ">=4.2.0,<6.0.0"
sqlalchemy = ">=2.0.41,<3.0.0"
imbalanced-learn = ">=0.12.0,<1.0.0"
black = ">=24.0.0,<25.0.0"
flake8 = ">=7.0.0,<8.0.0"
langchain-community = ">=0.0.30,<1.0.0"
langchain-ollama = ">=0.1.0,<1.0.0"
langchain-core = ">=0.1.50,<1.0.0"
langgraph = ">=0.0.35,<1.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
pytest = ">=8.4.0,<9.0.0"
pytest-cov = ">=6.2.1,<7.0.0"
pdoc = ">=15.0.4,<16.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
